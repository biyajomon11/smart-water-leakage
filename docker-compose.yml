version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: water_leakage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-water_leakage_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d water_leakage_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - iot_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: water_leakage_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-water_leakage_db}
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-water_leakage_db}
      - DEVICE_OFFLINE_THRESHOLD_SECONDS=15
      - PORT=5000
      - HOST=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - iot_network

volumes:
  postgres_data:
    driver: local

networks:
  iot_network:
    driver: bridge

